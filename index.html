<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, userscalable=no">
<title>Camera Area Zoom & Capture App</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sansserif; }
body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flexdirection: column; }
header { background: #1e293b; padding: 12px 16px; display: flex; justify-content: spacebetween; align-items: center; }
h1 { font-size: 1.15rem; color: #38bdf8; }
button { background: #3b82f6; color: white; border: none; padding: 8px 14px; border-radius:
6px; cursor: pointer; font-weight: 500; }
button.secondary { background: #475569; }
button.danger { background: #ef4444; }
button.success { background: #10b981; }
.main-container { flex: 1; display: flex; flex-direction: column; align-items: center;
padding: 12px; }
.view-wrapper { position: relative; max-width: 100%; border-radius: 12px; border: 2px solid
#334155; background: #000; }
video { display: none; }
canvas { display: block; max-width: 100%; height: auto; touch-action: none; cursor:
crosshair; }
.gallery-strip { width: 100%; max-width: 700px; margin-top: 10px; display: flex; gap: 8px;
overflow-x: auto; padding: 6px; background: #1e293b; border-radius: 8px; }
.gallery-thumb { width: 50px; height: 50px; border-radius: 4px; object-fit: cover; cursor:
pointer; border: 2px solid transparent; }
.modal { position: fixed; top: 0; background:rgba(0,0,0,0.95); z-index: 1000; display: none; flex-direction: column; top: 0; left: 0; width: 100%; height: 100%; }
.modal.active { display: flex; }
</style>
</head>
<body>
<header>
<h1>📷 कैमरा एरि या ज़ूमज़ू & मैग्नि फा यर</h1>
<div class="controls-top">
<button id="camSwitchBtn" class="secondary">🔄 कैमरा स्वि च</button>
<button id="captureBtn" class="success">📸 फो टो क्लि क करें</button>
</div>
</header>
<div class="main-container">
<div class="view-wrapper">
<video id="webcam" autoplay playsinline muted></video>
<canvas id="viewCanvas"></canvas>
</div>
<div class="gallery-strip" id="galleryStrip"></div>
<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('viewCanvas');
const ctx = canvas.getContext('2d');
let currentFacingMode = 'environment', stream = null, isDragging = false;
let startX = 0, startY = 0, endX = 0, endY = 0, hasActiveBox = false;
async function startCamera(facingMode) {
if (stream) stream.getTracks().forEach(t => t.stop());
stream = await navigator.mediaDevices.getUserMedia({
video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
});
video.srcObject = stream;
await video.play();
canvas.width = video.videoWidth || 640;
canvas.height = video.videoHeight || 480;
}
canvas.addEventListener('mousedown', (e) => {
const rect = canvas.getBoundingClientRect();
startX = (e.clientX - rect.left) * (canvas.width / rect.width);
startY = (e.clientY - rect.top) * (canvas.height / rect.height);
isDragging = true; hasActiveBox = true;
});
canvas.addEventListener('mousemove', (e) => {
if (!isDragging) return;
const rect = canvas.getBoundingClientRect();
endX = (e.clientX - rect.left) * (canvas.width / rect.width);
endY = (e.clientY - rect.top) * (canvas.height / rect.height);
});
  window.addEventListener('mouseup', () => isDragging = false);
function renderMain() {
if (video.readyState === video.HAVE_ENOUGH_DATA) {
ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
if (hasActiveBox) {
const xMin = Math.min(startX, endX), yMin = Math.min(startY, endY);
const boxW = Math.abs(endX - startX), boxH = Math.abs(endY - startY);
if (boxW > 20 && boxH > 20) {
ctx.save();
ctx.beginPath(); ctx.rect(xMin, yMin, boxW, boxH); ctx.clip();
ctx.drawImage(video, xMin + boxW/4, yMin + boxH/4, boxW/2, boxH/2, xMin, yMin,
boxW, boxH);
ctx.restore();
ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
ctx.strokeRect(xMin, yMin, boxW, boxH);
}
}
}
requestAnimationFrame(renderMain);
}
window.onload = () => { startCamera(currentFacingMode); renderMain(); };
</script>
</body>
</html>
